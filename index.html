<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cláudio Castro | Links Úteis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #58a6ff;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(88, 166, 255, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            color: #f0f6fc;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .links-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            color: #f0f6fc;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            background-color: #1f2937;
            border-color: #58a6ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.1);
        }

        .link-card i {
            font-size: 1.2rem;
            color: #58a6ff;
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="profile-img" src="https://github.com/claudiodeveloper-github.png" alt="Cláudio Castro">
        
        <h1>Cláudio G. S. Castro</h1>
        <p class="subtitle">Desenvolvedor Java Backend & Engenharia de Software</p>

        <div class="links-area">
            <a href="https://www.linkedin.com/in/claudio-g-s-castro" target="_blank" class="link-card">
                <i class="fab fa-linkedin"></i> LinkedIn Profissional
            </a>

            <a href="https://github.com/claudiodeveloper-github" class="link-card">
                <i class="fab fa-github"></i> Portfólio no GitHub
            </a>

            <a href="mailto:claudiodeveloper007@gmail.com" class="link-card">
                <i class="fas fa-envelope"></i> Enviar um E-mail
            </a>

            <a href="#" target="_blank" class="link-card">
                <i class="fas fa-file-pdf"></i> Baixar Currículo (PDF)
            </a>
        </div>

        <footer>
            <p>© 2026 | Desenvolvido por Cláudio Castro</p>
        </footer>
    </div>

</body>
</html>
